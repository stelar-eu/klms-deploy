# Manual TLS secret input for `stelarctl lake bootstrap`.
# Copy this file to ENV/manual_tls.yaml and edit the values.
# Each endpoint value is a directory containing tls.crt and tls.key.
# Secret names come from product_fullspec.json ingress.manual_tls.
manual_tls:
  primary: ./certs/primary
  keycloak: ./certs/keycloak
  minio_api: ./certs/minio-api
  registry: ./certs/registry
