name: Publish stelarctl to PyPI

on:
  push:
    tags:
      - "stelarctl-v*"

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build
          python -m pip install ".[test]"

      - name: Run stelarctl tests
        run: python -m pytest -q tests/stelarctl

      - name: Set package version from tag
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(r"stelarctl-v(\d+\.\d+\.\d+(?:\.post\d+)?)", tag)
          if not match:
              raise SystemExit(
                  "Expected release tag format stelarctl-vMAJOR.MINOR.PATCH "
                  "or stelarctl-vMAJOR.MINOR.PATCH.postN"
              )
          version = match.group(1)

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          text = re.sub(
              r'^version = "[^"]+"$',
              f'version = "{version}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          pyproject.write_text(text, encoding="utf-8")
          print(f"Package version: {version}")
          PY

      - name: Build package
        run: python -m build

      - name: Smoke-test built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          stelarctl --help

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish distribution to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/stelarctl-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
