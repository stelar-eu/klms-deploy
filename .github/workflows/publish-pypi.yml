name: Publish stelarctl to PyPI

on:
  push:
    branches:
      - main
    paths:
      - "src/stelar/**"
      - "pyproject.toml"

concurrency:
  group: publish-pypi-main
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build
          python -m pip install ".[test]"

      - name: Run stelarctl tests
        run: python -m pytest -q tests/stelarctl

      - name: Set unique package version
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          match = re.search(r'^version = "(\d+)\.(\d+)\.\d+"$', text, re.MULTILINE)
          if not match:
              raise SystemExit("Expected project.version to use MAJOR.MINOR.PATCH")

          run_number = os.environ["GITHUB_RUN_NUMBER"]
          run_attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          version = f"{match.group(1)}.{match.group(2)}.{run_number}"
          if run_attempt != "1":
              version = f"{version}.post{run_attempt}"

          text = re.sub(
              r'^version = "[^"]+"$',
              f'version = "{version}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          pyproject.write_text(text, encoding="utf-8")
          print(f"Package version: {version}")
          PY

      - name: Build package
        run: python -m build

      - name: Smoke-test built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          stelarctl --help

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish distribution to PyPI
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
